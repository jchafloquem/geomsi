<div class="p-4 flex flex-col gap-2 h-full">
  <mat-accordion displayMode="flat">
    <mat-expansion-panel *ngFor="let group of mapService.layerGroups; let first = first" class="mb-2 mat-elevation-z0 border border-gray-200 rounded-lg overflow-hidden" [expanded]="first" (opened)="panelOpenState.set(true)" (closed)="panelOpenState.set(false)">
      <mat-expansion-panel-header class="bg-secondary border-b border-gray-100 h-12">
        <mat-panel-title class="text-sm font-bold text-gray-800 uppercase">
          {{ group.name }}
        </mat-panel-title>
        <mat-panel-description class="grow-0">
          <span class="text-sm w-5 h-5 flex items-center justify-center text-white bg-primary rounded-full">
            {{ group.layers.length }}
          </span>
        </mat-panel-description>
      </mat-expansion-panel-header>
      <div class="flex flex-col w-full gap-1.5 pt-2">
        <div *ngFor="let layer of group.layers; let last = last">
          <div class="flex flex-row justify-between items-center hover:bg-gray-50 rounded px-2 -mx-2 transition-colors">
            <mat-checkbox [(ngModel)]="layer.visible" (change)="toggleLayer(layer.id, layer.visible)" color="primary" class="example-margin">
            </mat-checkbox>
            <div class="text-gray-700 text-sm font-medium text-right">{{ layer.name }}</div>
          </div>
          <div *ngIf="!last" class="border-0 border-b border-dashed border-gray-200 w-full my-1"></div>
        </div>
      </div>
    </mat-expansion-panel>
  </mat-accordion>
  <div *ngIf="mapService.layerGroups.length === 0" class="text-gray-500 text-sm italic">
    Cargando capas...
  </div>
</div>
